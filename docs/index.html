<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0d">
  <meta name="description" content="Transmisión Rebelde: resumen diario de prensa, en preparación.">
  <title>Transmisión Rebelde — en preparación</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #080a0d;
      --panel: rgba(15, 19, 24, .88);
      --amber: #ffad42;
      --amber-soft: #ffd08a;
      --paper: #f5f1e8;
      --muted: #a8adb3;
      --line: rgba(255, 173, 66, .28);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      overflow: hidden;
      color: var(--paper);
      background-color: var(--night);
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.75) 50%, transparent 100%),
        radial-gradient(1px 1px at 77% 28%, rgba(255,208,138,.8) 50%, transparent 100%),
        radial-gradient(1px 1px at 32% 76%, rgba(255,255,255,.62) 50%, transparent 100%),
        radial-gradient(1px 1px at 88% 83%, rgba(255,255,255,.55) 50%, transparent 100%),
        radial-gradient(ellipse at 50% 0%, rgba(87, 54, 22, .23), transparent 60%);
      background-size: 180px 180px, 230px 230px, 210px 210px, 260px 260px, auto;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      opacity: .18;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.035) 4px);
    }

    main {
      width: min(100%, 760px);
      position: relative;
      padding: clamp(30px, 7vw, 68px);
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(23, 28, 34, .94), var(--panel));
      box-shadow: 0 24px 100px rgba(0, 0, 0, .55), inset 0 1px rgba(255,255,255,.035);
    }

    main::before,
    main::after {
      position: absolute;
      width: 22px;
      height: 22px;
      content: "";
      border-color: var(--amber);
      opacity: .9;
    }

    main::before { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
    main::after { right: -1px; bottom: -1px; border-right: 2px solid; border-bottom: 2px solid; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 28px;
      color: var(--amber-soft);
      font: 600 .72rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .signal {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 14px rgba(255, 173, 66, .8);
    }

    h1 {
      max-width: 13ch;
      margin: 0;
      color: var(--paper);
      font: 700 clamp(2.25rem, 7vw, 4.7rem)/1.02 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: -.065em;
      text-wrap: balance;
    }

    h1 span { color: var(--amber); }

    .rule {
      width: 74px;
      height: 2px;
      margin: 34px 0 24px;
      background: var(--amber);
      box-shadow: 0 0 15px rgba(255, 173, 66, .45);
    }

    p {
      max-width: 52ch;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.12rem);
      line-height: 1.7;
    }

    footer {
      margin-top: 52px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,.09);
      color: #747c84;
      font: .68rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      main { padding: 32px 26px; }
      .eyebrow { letter-spacing: .13em; }
      footer { margin-top: 38px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow"><span class="signal" aria-hidden="true"></span>Canal de información · Estado: preparación</p>
    <h1>Transmisión Rebelde <span>— en preparación</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Estamos preparando este espacio para el resumen diario de prensa. La transmisión comenzará próximamente.</p>
    <footer>Frecuencia editorial · Señal provisional</footer>
  </main>
</body>
</html>
